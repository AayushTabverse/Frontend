<div class="admin-layout">
  <div class="sidebar-backdrop" *ngIf="mobileSidebarOpen" (click)="mobileSidebarOpen = false"></div>
  <nav class="sidebar" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileSidebarOpen">
    <button class="sidebar-toggle" (click)="sidebarCollapsed = !sidebarCollapsed">
      {{ sidebarCollapsed ? '☰' : '✕' }}
    </button>
    <div class="brand">
      <img *ngIf="logoUrl" [src]="logoUrl" alt="Logo" class="sidebar-logo" />
      🍽️ <span class="brand-text">{{ panelTitle }}</span>
    </div>
    <div class="nav-links">
      <a *ngFor="let item of navItems" [routerLink]="item.path" routerLinkActive="active" [attr.data-tooltip]="item.label" (click)="mobileSidebarOpen = false">{{ item.icon }} <span class="nav-text">{{ item.label }}</span></a>
    </div>
  </nav>

  <main class="content" [class.sidebar-collapsed]="sidebarCollapsed">
    <div class="layout-header">
      <button class="mobile-menu-btn" (click)="mobileSidebarOpen = !mobileSidebarOpen">☰</button>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <button class="dark-mode-toggle" (click)="themeService.toggle()">
          {{ themeService.isDark() ? '☀️ Light' : '🌙 Dark' }}
        </button>
        <span class="welcome" *ngIf="userName">{{ userName }}</span>
        <button class="logout-header-btn" (click)="logout()">🚪 Logout</button>
      </div>
    </div>
    <router-outlet></router-outlet>
  </main>
</div>
