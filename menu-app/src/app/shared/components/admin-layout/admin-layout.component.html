<div class="admin-layout">
  <div class="sidebar-backdrop" *ngIf="mobileSidebarOpen" (click)="mobileSidebarOpen = false"></div>
  <nav class="sidebar" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileSidebarOpen">
    <button class="sidebar-toggle" (click)="sidebarCollapsed = !sidebarCollapsed">
      {{ sidebarCollapsed ? '☰' : '✕' }}
    </button>
    <div class="brand">
      <img *ngIf="logoUrl" [src]="logoUrl" alt="Logo" class="sidebar-logo" />
      🍽️ <span class="brand-text">Admin</span>
    </div>
    <div class="nav-links">
      <a routerLink="/admin/dashboard" routerLinkActive="active" data-tooltip="Dashboard" (click)="mobileSidebarOpen = false">📊 <span class="nav-text">Dashboard</span></a>
      <a routerLink="/admin/analytics" routerLinkActive="active" data-tooltip="Analytics" (click)="mobileSidebarOpen = false">📈 <span class="nav-text">Analytics</span></a>
      <a *ngIf="hasPremium" routerLink="/admin/ai-marketing" routerLinkActive="active" data-tooltip="AI Marketing" (click)="mobileSidebarOpen = false">🤖 <span class="nav-text">AI Marketing</span></a>
      <a *ngIf="hasPremium" routerLink="/admin/reviews" routerLinkActive="active" data-tooltip="Reviews" (click)="mobileSidebarOpen = false">⭐ <span class="nav-text">Reviews</span></a>
      <a routerLink="/admin/menu" routerLinkActive="active" data-tooltip="Menu" (click)="mobileSidebarOpen = false">📋 <span class="nav-text">Menu</span></a>
      <a routerLink="/admin/tables" routerLinkActive="active" data-tooltip="Tables" (click)="mobileSidebarOpen = false">🪑 <span class="nav-text">Tables</span></a>
      <a routerLink="/admin/staff" routerLinkActive="active" data-tooltip="Staff" (click)="mobileSidebarOpen = false">👥 <span class="nav-text">Staff</span></a>
      <a routerLink="/waiter" routerLinkActive="active" data-tooltip="Take Order" (click)="mobileSidebarOpen = false">🛎️ <span class="nav-text">Take Order</span></a>
      <a *ngIf="hasPremium" routerLink="/admin/inventory" routerLinkActive="active" data-tooltip="Inventory" (click)="mobileSidebarOpen = false">📦 <span class="nav-text">Inventory</span></a>
      <a routerLink="/admin/website" routerLinkActive="active" data-tooltip="Website" (click)="mobileSidebarOpen = false">🌐 <span class="nav-text">Website</span></a>
      <a routerLink="/admin/settings" routerLinkActive="active" data-tooltip="Settings" (click)="mobileSidebarOpen = false">⚙️ <span class="nav-text">Settings</span></a>
      <a routerLink="/admin/bills" routerLinkActive="active" data-tooltip="Bills" (click)="mobileSidebarOpen = false">🧾 <span class="nav-text">Bills</span></a>
      <a routerLink="/admin/dues" routerLinkActive="active" data-tooltip="Udhaar" (click)="mobileSidebarOpen = false">📒 <span class="nav-text">Udhaar</span></a>
      <a routerLink="/admin/subscription" routerLinkActive="active" data-tooltip="Billing" (click)="mobileSidebarOpen = false">💳 <span class="nav-text">Billing</span></a>
    </div>
  </nav>

  <main class="content" [class.sidebar-collapsed]="sidebarCollapsed">
    <div class="layout-header">
      <button class="mobile-menu-btn" (click)="mobileSidebarOpen = !mobileSidebarOpen">☰</button>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <button class="dark-mode-toggle" (click)="themeService.toggle()">
          {{ themeService.isDark() ? '☀️ Light' : '🌙 Dark' }}
        </button>
        <span class="welcome" *ngIf="userName">{{ userName }}</span>
        <button class="logout-header-btn" (click)="logout()">🚪 Logout</button>
      </div>
    </div>
    <router-outlet></router-outlet>
  </main>
</div>
