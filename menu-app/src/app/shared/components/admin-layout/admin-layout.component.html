<div class="admin-layout">
  <app-sidebar [(collapsed)]="sidebarCollapsed" [(mobileOpen)]="mobileSidebarOpen"></app-sidebar>

  <main class="content" [class.sidebar-collapsed]="sidebarCollapsed">
    <!-- Mobile only: open the sidebar drawer -->
    <div class="mobile-bar">
      <button class="mobile-bar-btn" (click)="mobileSidebarOpen = true" aria-label="Open menu">
        <lucide-icon [img]="MenuIcon" [size]="20"></lucide-icon>
      </button>
      <span class="mobile-bar-title">{{ restaurantName || 'TabVerse' }}</span>
    </div>
    <router-outlet></router-outlet>
  </main>
</div>
